# OpenThread trimmed for a Matter end device, as far as its configuration goes.
# Off: features this node never uses. Kept: everything on the attach, stay
# attached and SRP paths (attach backoff, SRP auto start and saved server).
CONFIG_OPENTHREAD_OPERATIONAL_DATASET_AUTO_INIT=n
CONFIG_OPENTHREAD_DEVICE_PROP_LEADER_WEIGHT=n
# The NCS nRF5 radio platform reports CSMA-CA, the ACK timeout and (at 1.2 and
# later) transmit security as radio capabilities, so OpenThread's software
# versions are never called.
CONFIG_OPENTHREAD_MAC_SOFTWARE_ACK_TIMEOUT_ENABLE=n
CONFIG_OPENTHREAD_MAC_SOFTWARE_CSMA_BACKOFF_ENABLE=n
CONFIG_OPENTHREAD_MAC_SOFTWARE_TX_SECURITY_ENABLE=n
# Core switches with no Kconfig symbol: the MLE Announce sender (a router and
# channel-change feature), the SRP client's built-in name/service pools (the
# tinytalk port brings its own storage) and OpenThread's internal asserts.
CONFIG_OPENTHREAD_CUSTOM_PARAMETERS="OPENTHREAD_CONFIG_ANNOUNCE_SENDER_ENABLE=0 OPENTHREAD_CONFIG_SRP_CLIENT_BUFFERS_ENABLE=0 OPENTHREAD_CONFIG_ASSERT_ENABLE=0"
